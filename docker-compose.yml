services:
  db:
    image: postgres:15-alpine
    container_name: notenest-db-container
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "hot_standby=on"]
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-replica-1:
    image: postgres:15-alpine
    container_name: notenest-db-replica-1-container
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      PGPASSWORD: replpass
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
      - ./scripts/replica-entrypoint.sh:/docker-replica-entrypoint.sh:ro
      - ./scripts/check_replica_lag.sh:/docker-check-lag.sh:ro
    entrypoint: ["/bin/sh", "/docker-replica-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      data_net:
        aliases:
          - db-replicas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres} && /docker-check-lag.sh localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-replica-2:
    image: postgres:15-alpine
    container_name: notenest-db-replica-2-container
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      PGPASSWORD: replpass
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
      - ./scripts/replica-entrypoint.sh:/docker-replica-entrypoint.sh:ro
      - ./scripts/check_replica_lag.sh:/docker-check-lag.sh:ro
    entrypoint: ["/bin/sh", "/docker-replica-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      data_net:
        aliases:
          - db-replicas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres} && /docker-check-lag.sh localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: notenest-pgbouncer-container
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      LISTEN_PORT: 6432
      AUTH_TYPE: plain
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${DB_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pgbouncer-read:
    image: edoburu/pgbouncer:latest
    container_name: notenest-pgbouncer-read-container
    environment:
      DB_HOST: db-replicas
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      LISTEN_PORT: 6433
      AUTH_TYPE: plain
    ports:
      - "6433:6433"
    depends_on:
      db-replica-1:
        condition: service_healthy
      db-replica-2:
        condition: service_healthy
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6433 -U ${DB_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: notenest-redis-container
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.15
    container_name: notenest-consul-container
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    networks:
      - app_net
      - mgmt_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: notenest-minio-container
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  origin-nginx:
    build:
      context: .
      dockerfile: deployments/origin-nginx.Dockerfile
    container_name: notenest-origin-nginx-container
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data_net
    restart: unless-stopped

  edge-nginx:
    build:
      context: .
      dockerfile: deployments/edge-nginx.Dockerfile
    container_name: notenest-edge-nginx-container
    ports:
      - "8081:8081"
    depends_on:
      - origin-nginx
    networks:
      - public_net
      - data_net
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: notenest-auth-container
    environment:
      DATABASE_URL: host=pgbouncer port=6432 dbname=${DB_NAME:-postgres} user=${DB_USER:-postgres} password=${DB_PASSWORD:-pass}
      JWT_SECRET: ${JWT_SECRET:-default_super_secure_jwt_secret_key_12345_67890}
      PORT: 50051
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    ports:
      - "50051:50051"
      - "9101:9101"
    depends_on:
      pgbouncer:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch = grpc.insecure_channel('localhost:50051'); stub = health_pb2_grpc.HealthStub(ch); r = stub.Check(health_pb2.HealthCheckRequest(service=''), timeout=2); exit(0 if r.status == health_pb2.HealthCheckResponse.SERVING else 1)"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: notenest-user-container
    environment:
      DATABASE_URL: host=pgbouncer port=6432 dbname=${DB_NAME:-postgres} user=${DB_USER:-postgres} password=${DB_PASSWORD:-pass}
      PORT: 50052
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    ports:
      - "50052:50052"
      - "9102:9102"
    depends_on:
      pgbouncer:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch = grpc.insecure_channel('localhost:50052'); stub = health_pb2_grpc.HealthStub(ch); r = stub.Check(health_pb2.HealthCheckRequest(service=''), timeout=2); exit(0 if r.status == health_pb2.HealthCheckResponse.SERVING else 1)"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: notenest-kafka-container
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notenest-rabbitmq-container
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "15672:15672"
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notenest-app-container
    ports:
      - "8080:8080"
      - "50053:50053"
      - "50054:50054"
    environment:
      DATABASE_URL: host=pgbouncer port=6432 dbname=${DB_NAME:-postgres} user=${DB_USER:-postgres} password=${DB_PASSWORD:-pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-default_super_secure_jwt_secret_key_12345_67890}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-notenest-attachments}
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:8081}
      AUTH_SERVICE_URL: auth:50051
      USER_SERVICE_URL: user:50052
      NOTE_SERVICE_URL: app:50053
      ATTACHMENT_SERVICE_URL: app:50054
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "-X", "OPTIONS", "http://localhost:8080/signup"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: notenest-notification-container
    ports:
      - "9103:9103"
    environment:
      KAFKA_BROKERS: kafka:9092
      NOTE_SERVICE_URL: app:50054
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    restart: unless-stopped

  graphql:
    build:
      context: ./services/graphql
      dockerfile: Dockerfile
    container_name: notenest-graphql-container
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: host=pgbouncer port=6432 dbname=${DB_NAME:-postgres} user=${DB_USER:-postgres} password=${DB_PASSWORD:-pass}
      JWT_SECRET: ${JWT_SECRET:-default_super_secure_jwt_secret_key_12345_67890}
      PORT: 4000
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      pgbouncer:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - app_net
      - data_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kong:
    image: kong:3.5
    container_name: notenest-kong-container
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_LOG_LEVEL: notice
    volumes:
      - ./deployments/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      app:
        condition: service_healthy
      graphql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public_net
      - app_net
      - data_net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deployments/nginx.Dockerfile
    container_name: notenest-nginx-container
    ports:
      - "8082:80"
    depends_on:
      app:
        condition: service_healthy
      kong:
        condition: service_healthy
      edge-nginx:
        condition: service_started
    networks:
      - public_net
      - app_net
    restart: unless-stopped

  haproxy:
    image: haproxy:2.8-alpine
    container_name: notenest-haproxy-container
    ports:
      - "80:80"
    volumes:
      - ./deployments/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nginx
    networks:
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bastion:
    image: alpine:3.20
    container_name: notenest-bastion-container
    command: ["sleep", "infinity"]
    networks:
      - public_net
      - app_net
      - data_net
      - mgmt_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: notenest-prometheus-container
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - app_net
      - data_net
      - mgmt_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: notenest-alertmanager-container
    volumes:
      - ./deployments/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_net
      - mgmt_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: notenest-loki-container
    volumes:
      - ./deployments/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    networks:
      - app_net
      - mgmt_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    container_name: notenest-promtail-container
    volumes:
      - ./deployments/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    networks:
      - app_net
      - mgmt_net
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.1
    container_name: notenest-tempo-container
    volumes:
      - ./deployments/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "3200:3200"
    networks:
      - app_net
      - mgmt_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: notenest-otel-collector-container
    volumes:
      - ./deployments/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - app_net
      - mgmt_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: notenest-grafana-container
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployments/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deployments/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - public_net
      - app_net
      - mgmt_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
  data_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24
  mgmt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24

volumes:
  pg_data:
  pg_replica1_data:
  pg_replica2_data:
  redis_data:
  minio_data:
  kafka_data:
