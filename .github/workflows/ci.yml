name: CI - Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  lint-code:
    name: Lint & Code Style
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Check C++ Formatting
        run: |
          echo "Checking C++ formatting..."
          clang-format --dry-run --Werror src/*.cpp include/notenest/*.hpp

      - name: Check Python Code Style
        run: |
          echo "Checking Python formatting..."
          black --check --exclude '.*_pb2.*\.py$' services/ tests/ || true
          flake8 services/ tests/ --exclude='*_pb2*.py' --max-line-length=120 --ignore=E203,W503,F401,E501,E402,W291,W293 || true

      - name: Check Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

  unit-and-integration-tests:
    name: Unit & Service Build Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            g++-15 \
            gcc-15 \
            make \
            nlohmann-json3-dev \
            libpq-dev \
            libsodium-dev \
            libssl-dev \
            libhiredis-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc \
            librdkafka-dev \
            librabbitmq-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100

      - name: Compile NoteNest Backend
        run: |
          make -j$(nproc)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Microservices Syntax
        run: |
          pip install grpcio-tools
          python -m grpc_tools.protoc -Iprotos --python_out=services/auth --grpc_python_out=services/auth protos/auth.proto
          python -m grpc_tools.protoc -Iprotos --python_out=services/user --grpc_python_out=services/user protos/user.proto
          python -m py_compile services/*.py services/*/*.py 2>/dev/null || true

  helm-and-tf-validation:
    name: Helm & Terraform Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Lint Helm Chart
        run: |
          helm lint deployments/helm/notenest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Validate Terraform Modules
        run: |
          cd deployments/terraform
          terraform init -backend=false
          terraform validate

  docker-e2e-integration:
    name: Docker Compose E2E Integration
    needs: [lint-code, unit-and-integration-tests, helm-and-tf-validation]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Install grpcurl CLI
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin grpcurl

      - name: Generate CI runtime secrets
        run: make setup

      - name: Build NoteNest Docker Image with GHA Caching
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: notenest:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Ephemeral Infrastructure
        run: |
          docker compose up -d --build

      - name: Run E2E Test Suite
        run: |
          chmod +x tests/run_tests.sh tests/suites/*.sh
          ./tests/e2e_test_docker.sh

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail=100

      - name: Teardown Infrastructure
        if: always()
        run: |
          docker compose down -v
