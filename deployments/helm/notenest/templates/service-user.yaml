apiVersion: v1
kind: Service
metadata:
  name: {{ include "notenest.fullname" . }}-user
  labels:
    app.kubernetes.io/component: user-service
    {{- include "notenest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: {{ .Values.user.port }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.user.metricsPort }}
      targetPort: metrics
  selector:
    app.kubernetes.io/component: user-service
    app.kubernetes.io/instance: {{ .Release.Name }}
