{{- if not .Values.global.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notenest.secretName" . }}
  labels:
    {{- include "notenest.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.global.db.user | default "postgres" | quote }}
  DB_PASSWORD: {{ .Values.global.db.password | default "pass" | quote }}
  JWT_SECRET: {{ required "global.jwtSecret is required - generate with `openssl rand -hex 64` (or set global.existingSecret)" .Values.global.jwtSecret | quote }}
  MINIO_ACCESS_KEY: {{ .Values.global.minio.accessKey | default "minioadmin" | quote }}
  MINIO_SECRET_KEY: {{ .Values.global.minio.secretKey | default "minioadmin" | quote }}
{{- end }}
