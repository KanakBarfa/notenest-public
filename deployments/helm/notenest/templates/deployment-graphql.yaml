apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notenest.fullname" . }}-graphql
  labels:
    app.kubernetes.io/component: graphql-service
    {{- include "notenest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.graphql.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: graphql-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: graphql-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: graphql-service
          image: "{{ .Values.graphql.image.repository }}:{{ .Values.graphql.image.tag }}"
          imagePullPolicy: {{ .Values.graphql.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.graphql.port }}
          env:
            - name: DATABASE_URL
              value: "host=$(DB_HOST) port=$(DB_PORT) dbname=$(DB_NAME) user=$(DB_USER) password=$(DB_PASSWORD)"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "notenest.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notenest.secretName" . }}
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "notenest.secretName" . }}
                  key: JWT_SECRET
            - name: PORT
              value: {{ .Values.graphql.port | quote }}
            - name: CONSUL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: CONSUL_HOST
            - name: CONSUL_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: CONSUL_PORT
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.graphql.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.graphql.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.graphql.resources | nindent 12 }}
