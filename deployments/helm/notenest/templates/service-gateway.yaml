apiVersion: v1
kind: Service
metadata:
  name: {{ include "notenest.fullname" . }}-gateway
  labels:
    app.kubernetes.io/component: gateway
    {{- include "notenest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: proxy
      port: {{ .Values.gateway.proxyPort }}
      targetPort: proxy
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
