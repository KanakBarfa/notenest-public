apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notenest.fullname" . }}-user
  labels:
    app.kubernetes.io/component: user-service
    {{- include "notenest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.user.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: user-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: user-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.user.image.repository }}:{{ .Values.user.image.tag }}"
          imagePullPolicy: {{ .Values.user.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.user.port }}
            - name: metrics
              containerPort: {{ .Values.user.metricsPort }}
          env:
            - name: DATABASE_URL
              value: "host=$(DB_HOST) port=$(DB_PORT) dbname=$(DB_NAME) user=$(DB_USER) password=$(DB_PASSWORD)"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "notenest.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notenest.secretName" . }}
                  key: DB_PASSWORD
            - name: PORT
              value: {{ .Values.user.port | quote }}
            - name: CONSUL_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: CONSUL_HOST
            - name: CONSUL_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notenest.fullname" . }}-config
                  key: CONSUL_PORT
          livenessProbe:
            tcpSocket:
              port: {{ .Values.user.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: {{ .Values.user.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.user.resources | nindent 12 }}
