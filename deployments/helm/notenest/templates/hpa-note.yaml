{{- if .Values.note.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "notenest.fullname" . }}-note-hpa
  labels:
    app.kubernetes.io/component: note-service
    {{- include "notenest.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "notenest.fullname" . }}-note
  minReplicas: {{ .Values.note.hpa.minReplicas }}
  maxReplicas: {{ .Values.note.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.note.hpa.targetCPUUtilizationPercentage }}
{{- end }}
