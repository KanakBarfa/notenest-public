apiVersion: v1
kind: Service
metadata:
  name: {{ include "notenest.fullname" . }}-graphql
  labels:
    app.kubernetes.io/component: graphql-service
    {{- include "notenest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.graphql.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: graphql-service
    app.kubernetes.io/instance: {{ .Release.Name }}
