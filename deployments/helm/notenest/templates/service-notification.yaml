apiVersion: v1
kind: Service
metadata:
  name: {{ include "notenest.fullname" . }}-notification
  labels:
    app.kubernetes.io/component: notification-service
    {{- include "notenest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.notification.metricsPort }}
      targetPort: metrics
  selector:
    app.kubernetes.io/component: notification-service
    app.kubernetes.io/instance: {{ .Release.Name }}
