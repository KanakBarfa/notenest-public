global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  1h
    default-server init-addr last,libc,none

frontend http_front
    bind *:80

    # The API prefix is a frontend-only convention; Kong routes unprefixed.
    acl is_api path_beg /api/
    http-request set-path %[path,regsub(^/api/,/)] if is_api

    # Route WebSocket connections using consistent hashing by URI path
    acl is_websocket hdr(Upgrade) -i websocket
    use_backend websocket_backend if is_websocket

    default_backend gateway_backend

backend gateway_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server kong1 kong:8000 check inter 2s fall 3 rise 2

backend websocket_backend
    mode http
    balance uri
    hash-type consistent
    server kong1 kong:8000 check inter 2s fall 3 rise 2
