global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "app-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8080"]

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth:9101"]

  - job_name: "user-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["user:9102"]

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification:9103"]

  - job_name: "graphql-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["graphql:4000"]
