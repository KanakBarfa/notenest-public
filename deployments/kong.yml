_format_version: "3.0"
_transform: true

services:
  - name: notenest-backend
    url: http://app:8080
    routes:
      - name: public-signup
        paths:
          - /signup
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

      - name: public-login
        paths:
          - /login
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

      - name: protected-auth-actions
        paths:
          - /logout
          - /realtime
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

      - name: protected-notes
        paths:
          - /notes
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              limit_by: ip
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

      - name: protected-events
        paths:
          - /events
        strip_path: false
        plugins:

  - name: notenest-graphql
    url: http://graphql:4000
    routes:
      - name: protected-graphql
        paths:
          - /graphql
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              limit_by: ip
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

# JWT validation happens at the app layer; Kong provides rate limiting only.
