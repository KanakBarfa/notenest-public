_format_version: "3.0"
_transform: true

services:
  - name: notenest-backend
    url: http://app:8080
    routes:
      - name: public-signup
        paths:
          - /signup
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

      - name: public-login
        paths:
          - /login
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

      - name: protected-notes
        paths:
          - /notes
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss
              uri_param_names:
                - token
                - jwt
                - access_token
              run_on_preflight: false
          - name: rate-limiting
            config:
              minute: 600
              limit_by: ip
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

      - name: protected-events
        paths:
          - /events
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss
              uri_param_names:
                - token
                - jwt
                - access_token
              run_on_preflight: false

  - name: notenest-graphql
    url: http://graphql:4000
    routes:
      - name: protected-graphql
        paths:
          - /graphql
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss
              uri_param_names:
                - token
                - jwt
                - access_token
              run_on_preflight: false
          - name: rate-limiting
            config:
              minute: 600
              limit_by: ip
              policy: redis
              redis_host: redis
              redis_port: 6379
              fault_tolerant: true
              hide_client_headers: false

consumers:
  - username: notenest-app
    jwt_secrets:
      - key: notenest
        secret: default_super_secure_jwt_secret_key_12345_67890
        algorithm: HS256
