map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Nginx access logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location /api/events {
        proxy_pass http://kong:8000/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        # Strip Kong consumer headers from client requests so only Kong can set them.
        proxy_set_header X-Consumer-ID "";
        proxy_set_header X-Consumer-Username "";
        proxy_set_header X-Consumer-Custom-ID "";
        proxy_set_header X-Credential-Identifier "";
    }

    location /api/ {
        proxy_pass http://kong:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Strip Kong consumer headers from client requests so only Kong can set them.
        proxy_set_header X-Consumer-ID "";
        proxy_set_header X-Consumer-Username "";
        proxy_set_header X-Consumer-Custom-ID "";
        proxy_set_header X-Credential-Identifier "";
    }

    # Route attachment requests to CDN Edge server
    location /notenest-attachments/ {
        proxy_pass http://edge-nginx:8081/notenest-attachments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default route for frontend SPA
    location / {
        root /var/www/frontend;
        index index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
