# Configure disk cache zone for CDN edge node
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:10m max_size=1g inactive=60m use_temp_path=off;

map $request_method $purge_method {
    PURGE 1;
    default 0;
}

# Docker embedded DNS; re-resolve instead of caching a stale container IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8081;
    server_name edge-nginx;

    access_log /var/log/nginx/edge_access.log;
    error_log /var/log/nginx/edge_error.log warn;

    client_max_body_size 100M;

    location / {
        set $origin_upstream http://origin-nginx:9005;
        proxy_pass $origin_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Key includes query string: presigned auth lives in query params.
        proxy_cache cdn_cache;
        proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 304 60m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;

        # Allow cache bypass via PURGE method or X-Purge-Cache header
        proxy_cache_bypass $purge_method $http_x_purge_cache;

        # Add CDN cache status header to response
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
