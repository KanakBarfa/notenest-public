# CORS locked to the app origin; wildcard invites cross-origin attachment theft.
map $http_origin $cors_origin {
    "http://localhost"      $http_origin;
    "http://127.0.0.1"      $http_origin;
    default                 "";
}

server {
    listen 9005;
    server_name origin-nginx;

    # Docker embedded DNS; re-resolve instead of caching a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $minio_upstream http://minio:9000;

    access_log /var/log/nginx/origin_access.log;
    error_log /var/log/nginx/origin_error.log warn;

    client_max_body_size 100M;

    location / {
        proxy_pass $minio_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # User-private: never shared-cacheable (CDN/proxy).
        proxy_hide_header Cache-Control;

        # Strip MinIO's permissive CORS so only the locked policy is emitted.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Cache-Control "private, max-age=3600, stale-while-revalidate=86400" always;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers
            "Authorization,Content-Type,x-amz-content-sha256,x-amz-date" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
