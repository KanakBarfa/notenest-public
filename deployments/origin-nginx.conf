server {
    listen 9005;
    server_name origin-nginx;

    access_log /var/log/nginx/origin_access.log;
    error_log /var/log/nginx/origin_error.log warn;

    client_max_body_size 100M;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserves and injects origin Cache-Control headers for CDN Edge caching
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;

        # Set CORS headers to allow cross-origin attachment access
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }
}
